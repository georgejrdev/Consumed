name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Testes com cobertura
        run: npm test

      - name: Build
        run: npm run build

      - name: E2E (Electron sob Xvfb)
        run: xvfb-run -a npm run e2e

  package:
    name: Empacotar (AppImage)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Empacotar
        run: npm run package

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: consumed-linux
          path: release/*.AppImage
          if-no-files-found: error
